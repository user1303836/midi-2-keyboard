[workspace]
resolver = "3"
members = ["crates/m2k-midi", "crates/m2k-output", "crates/m2k-core", "crates/m2k-cli", "src-tauri"]
default-members = ["crates/m2k-midi", "crates/m2k-output", "crates/m2k-core", "crates/m2k-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Tauri 2.12 needs 1.90; the resolver is MSRV-aware, so a lower value here silently downgrades it.
rust-version = "1.90"
repository = "https://github.com/user1303836/midi-2-keyboard"

[workspace.dependencies]
m2k-midi = { path = "crates/m2k-midi" }
m2k-output = { path = "crates/m2k-output" }
m2k-core = { path = "crates/m2k-core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12", features = ["serde-compat"] }
log = "0.4"
thiserror = "2"
crossbeam-channel = "0.5"

[profile.dev]
# Keep the MIDI -> key path responsive even in debug builds.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
