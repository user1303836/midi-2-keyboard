[package]
name = "m2k-output"
description = "Key model and OS input injection (keyboard, mouse, text) for midi-2-keyboard."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
ts-rs.workspace = true
log.workspace = true
thiserror.workspace = true

# Platform backends. Only pure-Rust crates (no C build scripts), so every target can be
# type-checked from any host: `cargo check -p m2k-output --target <triple>`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
