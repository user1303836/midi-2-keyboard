[package]
name = "m2k-output"
description = "Key model and OS input injection (keyboard, mouse, text) for midi-2-keyboard."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
ts-rs.workspace = true
log.workspace = true
thiserror.workspace = true

# Platform backends. Only pure-Rust crates (no C build scripts), so every target can be
# type-checked from any host: `cargo check -p m2k-output --target <triple>`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
x11rb = { version = "0.14", default-features = false, features = ["xtest"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFCGTypes",
    "CFDictionary",
    "CFNumber",
    "CFString",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGDirectDisplay",
    "CGError",
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    "CGRemoteOperation",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSDate",
    "NSGeometry",
    "NSString",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "libc",
    "objc2-core-graphics",
    "NSEvent",
    "NSGraphicsContext",
    "NSRunningApplication",
    "NSWorkspace",
] }
objc2-application-services = { version = "0.3", default-features = false, features = [
    "std",
    "libc",
    "AXError",
    "AXUIElement",
    "HIServices",
] }
