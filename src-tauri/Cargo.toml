[package]
name = "midi-2-keyboard"
description = "Translate MIDI events into keyboard and mouse input."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
m2k-midi.workspace = true
m2k-output.workspace = true
m2k-core.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
# Keep in step with @tauri-apps/api in package.json (the CLI refuses mismatched minor versions).
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"

# Already part of the dependency tree through Tauri / m2k-output; used directly for the tray-host
# probe (Linux) and for waiting out the previous instance after "Restart as administrator".
[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.18"
gtk = "0.18"
x11rb = { version = "0.14", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
